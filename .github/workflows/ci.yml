name: CI/CD

# main'ga push: tekshiruv -> image'lar GHCR'ga -> serverga deploy.
# Pull request: faqat tekshiruv (build/deploy yo'q).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deploy'lar navbat bilan — hech qachon parallel emas
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/yahyohakimov/tempcover-backend
  FRONTEND_IMAGE: ghcr.io/yahyohakimov/tempcover-frontend

jobs:
  backend:
    name: Backend (migrations + seed + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Migratsiya va seed haqiqiy Postgres'ga qarshi ishlaydi
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tempcover
          POSTGRES_PASSWORD: tempcover
          POSTGRES_DB: tempcover
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempcover -d tempcover"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tempcover:tempcover@127.0.0.1:5432/tempcover
      STATIC_DIR: ./static
      APP_URL: http://localhost:3001
      SEED_SUPERADMIN_PASSWORD: ci-only-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # WeasyPrint (PDF) tizim kutubxonalari — Dockerfile bilan bir xil to'plam
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            libffi8 shared-mime-info fonts-liberation

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      # Seed ikki marta: ikkinchisi hech narsa qo'shmasligi (idempotentlik) tekshiriladi
      - name: Seed (twice — must be idempotent)
        run: |
          python seed.py
          python seed.py | tee /tmp/seed2.log
          ! grep -qE "^(Created|Registered)" /tmp/seed2.log

      # Uchala PDF + tasdiqlash emaili haqiqatan yaratiladi (sahifa soni, narx taqsimoti)
      - name: Smoke test — PDFs and email
        run: python tests/ci_smoke.py

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image'lar GitHub runner'da quriladi — serverda hech qachon build yo'q (RAM kam)
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30m
          envs: GHCR_USER,GHCR_TOKEN,REPO,SHA
          script: |
            set -e
            APP_DIR=/opt/tempcover
            # GITHUB_TOKEN shu run davomida repo'ni o'qiy oladi — private bo'lsa ham.
            # Token faqat buyruq ichida ishlatiladi, diskda (remote URL'da) qolmaydi.
            AUTH_URL="https://x-access-token:${GHCR_TOKEN}@github.com/${REPO}.git"

            # Birinchi deploy: repo yo'q bo'lsa clone qilamiz
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$AUTH_URL" "$APP_DIR"
              git -C "$APP_DIR" remote set-url origin "https://github.com/${REPO}.git"
            fi
            cd "$APP_DIR"

            # Server-only .env hard reset'dan omon qoladi
            cp backend/.env /tmp/tempcover_env_backup 2>/dev/null || true
            git fetch "$AUTH_URL" main
            git reset --hard FETCH_HEAD
            cp /tmp/tempcover_env_backup backend/.env 2>/dev/null || true

            # Birinchi deploy: .env yo'q — namunadan yaratamiz, sirlarni qo'lda to'ldirish kerak
            if [ ! -f backend/.env ]; then
              cp backend/.env.example backend/.env
              echo "⚠️  backend/.env namunadan yaratildi — SECRET_KEY, SEED_SUPERADMIN_PASSWORD, BREVO_API_KEY ni to'ldirib 'docker compose up -d' qiling"
            fi

            # Umumiy nginx gateway tarmog'i
            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            # Tayyor image'larni tortamiz — serverda build yo'q
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull backend frontend
            docker compose up -d --remove-orphans
            docker logout ghcr.io

            # Backend ko'tarilguncha kutamiz (konteyner CMD'si avval alembic upgrade head qiladi)
            for i in $(seq 1 45); do
              if docker compose exec -T backend python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            # Superadmin + statik hujjatlar (idempotent)
            docker compose exec -T backend python seed.py

            # Health-check — yiqilsa deploy qizil bo'ladi
            docker compose exec -T backend python -c "import urllib.request,sys;r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5);b=r.read().decode();print(b);sys.exit(0 if r.status==200 and 'ok' in b else 1)"

            docker image prune -f
            echo "✅ TempCover deployed ${SHA}"
