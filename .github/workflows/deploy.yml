name: Deploy TempCover

on:
  push:
    branches:
      - main

# Deploys queue up — never build/deploy in parallel
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Images are built on the GitHub runner — the production server never builds (low RAM)
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/yahyohakimov/tempcover-backend:latest
            ghcr.io/yahyohakimov/tempcover-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/yahyohakimov/tempcover-frontend:latest
            ghcr.io/yahyohakimov/tempcover-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/tempcover

            # Keep the server-only .env across the hard reset
            cp backend/.env /tmp/tempcover_env_backup 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/tempcover_env_backup backend/.env 2>/dev/null || true

            # Pull prebuilt images (no build on the server)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull backend frontend
            docker compose up -d

            # The shared gateway must pick up any nginx change committed in the swiftshield repo
            docker image prune -f
            echo "✅ TempCover deployed"
