# tempcover-verify.com — server block for the SHARED nginx gateway
# (/opt/swiftshield/nginx.conf on the production server; keep it committed in that repo,
#  a deploy there runs `git reset --hard` and wipes uncommitted edits).
#
# Requires: certbot cert for tempcover-verify.com (+ www), DNS A record -> server IP,
#           and this stack running with `docker compose up -d` (containers join the "proxy" network).

server {
    listen 443 ssl;
    server_name tempcover-verify.com www.tempcover-verify.com;

    ssl_certificate     /etc/letsencrypt/live/tempcover-verify.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tempcover-verify.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location /api/ {
        set $tempcover_api http://tempcover_backend:8000;
        proxy_pass         $tempcover_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 10s;
    }

    location /static/ {
        set $tempcover_api http://tempcover_backend:8000;
        proxy_pass         $tempcover_api;
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        set $tempcover_front http://tempcover_frontend:3000;
        proxy_pass         $tempcover_front;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_read_timeout 60s;
    }
}
